server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Запас над лимитом API (10 МБ), чтобы клиент получил корректный JSON от Express.
    client_max_body_size 12m;

    # 413 от nginx должен быть JSON, а не HTML-страницей.
    error_page 413 = @too_large;

    location @too_large {
        default_type application/json;
        return 413 '{"error":"Слишком большое тело запроса"}';
    }

    # ^~ отключает проверку regex-локаций: /api/... всегда уходит в Express,
    # включая пути с расширениями .js/.css и сам /api.
    location ^~ /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Не буферизуем тело запроса и ответ, чтобы файлы шли потоком.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
