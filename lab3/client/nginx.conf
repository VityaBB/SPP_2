server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Запас над лимитом API (10 МБ), чтобы клиент получил корректный JSON от Express.
    client_max_body_size 12m;

    # 413 от nginx должен быть JSON, а не HTML-страницей.
    error_page 413 = @too_large;

    location @too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Слишком большой запрос","status":413}';
    }

    # ^~ отключает проверку regex-локаций: /api/... всегда уходит в Express,
    # включая пути с расширениями .js/.css и сам /api.
    location ^~ /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Не буферизуем тело запроса и ответ, чтобы файлы шли потоком.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
